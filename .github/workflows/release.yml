# Release automation: push a tag like v0.2.0 and this workflow
#   1. verifies the tag matches the app version in tauri.conf.json
#   2. builds the macOS .app (arm64) and runs the Rust test suite
#   3. refuses to go further unless the build is Developer ID signed,
#      notarized, and stapled (when the signing secrets are present)
#   4. publishes a GitHub release with the .app tarball
#   5. bumps version + sha256 in mpurdon/homebrew-tap so
#      `brew upgrade` picks it up
#
# Step 4 needs a TAP_GITHUB_TOKEN repo secret: a fine-grained PAT with
# contents:read/write on mpurdon/homebrew-tap. Without it the release
# still publishes and the tap bump is skipped with a notice.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # Signing + notarization activate automatically when the APPLE_*
      # secrets exist; with them absent the build is ad-hoc signed (the
      # pre-Developer-ID behavior). Tauri imports the certificate into a
      # temporary keychain and runs notarytool + stapling itself.
      - name: Configure signing & notarization
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { if [ -n "$2" ]; then printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; fi; }
          put APPLE_CERTIFICATE "$CERT"
          put APPLE_CERTIFICATE_PASSWORD "$CERT_PW"
          put APPLE_SIGNING_IDENTITY "$IDENTITY"
          put APPLE_ID "$AID"
          put APPLE_PASSWORD "$APW"
          put APPLE_TEAM_ID "$TEAM"
          if [ -n "$CERT" ]; then echo "::notice::Developer ID signing enabled"; else echo "::notice::no signing secrets — building ad-hoc signed"; fi

      - name: Build app bundle
        # DMG bundling drives Finder via AppleScript and cannot run
        # headless — the cask installs from the .app tarball anyway.
        run: bun run tauri build --bundles app

      # An ad-hoc signed build installs fine from a local build but reaches
      # users as "sleipnir is damaged and can't be opened" once Homebrew
      # attaches the quarantine flag. If the signing secrets were present,
      # the artifact must actually be notarized and stapled before it is
      # allowed anywhere near the release.
      - name: Verify signature and notarization
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          APP=src-tauri/target/release/bundle/macos/sleipnir.app
          if [ -z "$CERT" ]; then
            echo "::warning::no signing secrets — publishing an ad-hoc signed build"
            exit 0
          fi
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Authority=Developer ID Application" || {
            echo "::error::app is not Developer ID signed"; exit 1; }
          xcrun stapler validate "$APP" || {
            echo "::error::notarization ticket is not stapled"; exit 1; }
          spctl -a -vv -t exec "$APP" 2>&1 | grep -q "source=Notarized Developer ID" || {
            echo "::error::Gatekeeper does not accept the app as notarized"; exit 1; }
          echo "::notice::Developer ID signed, notarized, and stapled"

      - name: Package tarball
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="sleipnir_${VERSION}_aarch64.app.tar.gz"
          cd src-tauri/target/release/bundle/macos
          # COPYFILE_DISABLE stops bsdtar from embedding ._* AppleDouble
          # entries for extended attributes, which differ run to run.
          COPYFILE_DISABLE=1 tar -czf "$NAME" sleipnir.app
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "file=$PWD/$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pkg.outputs.name }}
          FILE: ${{ steps.pkg.outputs.file }}
        run: |
          # Idempotent so a rerun after a late-step failure doesn't die on
          # "release already exists" before reaching the tap bump.
          #
          # The published bytes are authoritative. tar is not reproducible,
          # so re-uploading on a rerun would hand the same filename different
          # bytes and break the sha256 for anyone who already downloaded it
          # or has it in ~/Library/Caches/Homebrew/downloads. If the asset is
          # already up, keep it and checksum what is actually published.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if gh release view "$GITHUB_REF_NAME" --json assets \
                 --jq '.assets[].name' | grep -qxF "$NAME"; then
              echo "::notice::$NAME is already published — reusing those bytes"
              rm -rf published
              gh release download "$GITHUB_REF_NAME" --pattern "$NAME" --dir published
              FILE="published/$NAME"
            else
              gh release upload "$GITHUB_REF_NAME" "$FILE"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" \
              --title "sleipnir $GITHUB_REF_NAME" \
              --generate-notes
          fi
          echo "sha=$(shasum -a 256 "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_GITHUB_TOKEN not set — skipping tap bump. Update Casks/sleipnir-aws.rb manually."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="${{ steps.publish.outputs.sha }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mpurdon/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/sleipnir-aws.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/sleipnir-aws.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "::notice::tap already at ${VERSION} with this sha — nothing to push"
            exit 0
          fi
          git commit -am "sleipnir ${VERSION}"
          git push
