# Release automation: push a tag like v0.2.0 and this workflow
#   1. verifies the tag matches the app version in tauri.conf.json
#   2. builds the macOS .app (arm64) and runs the Rust test suite
#   3. publishes a GitHub release with the .app tarball
#   4. bumps version + sha256 in mpurdon/homebrew-tap so
#      `brew upgrade` picks it up
#
# Step 4 needs a TAP_GITHUB_TOKEN repo secret: a fine-grained PAT with
# contents:read/write on mpurdon/homebrew-tap. Without it the release
# still publishes and the tap bump is skipped with a notice.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build app bundle
        # DMG bundling drives Finder via AppleScript and cannot run
        # headless — the cask installs from the .app tarball anyway.
        run: bun run tauri build --bundles app

      - name: Package tarball
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release/bundle/macos
          tar -czf "sleipnir_${VERSION}_aarch64.app.tar.gz" sleipnir.app
          echo "sha=$(shasum -a 256 "sleipnir_${VERSION}_aarch64.app.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=src-tauri/target/release/bundle/macos/sleipnir_${VERSION}_aarch64.app.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.file }}" \
            --title "sleipnir $GITHUB_REF_NAME" \
            --generate-notes

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_GITHUB_TOKEN not set — skipping tap bump. Update Casks/sleipnir.rb manually."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="${{ steps.pkg.outputs.sha }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mpurdon/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/sleipnir.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/sleipnir.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "sleipnir ${VERSION}"
          git push
