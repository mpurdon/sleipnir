# Manual sanity check for the TAP_GITHUB_TOKEN secret: clones the tap and
# pushes an empty commit, proving contents:write without cutting a release.
# Run from the Actions tab or: gh workflow run validate-tap
name: validate-tap

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Push no-op commit to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set"
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mpurdon/homebrew-tap.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "tap token validation (no-op)"
          git push
          echo "::notice::TAP_GITHUB_TOKEN can push to homebrew-tap"
