[package]
name = "sleipnir"
version = "0.1.6"
description = "AWS SSO / credential manager"
edition = "2021"

[lib]
name = "sleipnir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "sync", "net", "process"] }
futures = "0.3"
aws-sdk-ssooidc = "1"
aws-sdk-sso = "1"
aws-smithy-types = "1"
sha1 = "0.10"
hex = "0.4"
# keyring v3 ships with NO platform backends by default — without these
# features it silently uses an in-memory mock store and nothing persists
# across restarts (which cost us every refresh token for a while).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
toml = "0.8"
dirs = "5"
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
